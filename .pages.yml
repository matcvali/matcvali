# Configuração do painel de edição (Pages CMS: https://app.pagescms.org)
# Cada item de "content" vira uma seção no painel.

media:
  - name: imagens
    label: Imagens
    input: public/imagens
    output: /imagens
    categories: [image]
  - name: documentos
    label: PDFs
    input: public/documentos
    output: /documentos
    extensions: [pdf]

content:
  # ---------------- PERFIL / CURRÍCULO ----------------
  - name: perfil
    label: Perfil e currículo
    type: file
    path: src/data/perfil.yml
    format: yaml
    fields:
      - { name: nome, label: Nome completo, type: string, required: true }
      - { name: nome_curto, label: Nome curto (aparece no menu), type: string }
      - { name: titulo, label: Título (ex. Estudante de Física), type: string }
      - { name: titulo_en, label: Título em inglês, type: string }
      - { name: titulo_es, label: Título em espanhol, type: string }
      - { name: bio, label: Bio, type: text }
      - { name: bio_en, label: Bio em inglês, type: text }
      - { name: bio_es, label: Bio em espanhol, type: text }
      - { name: foto, label: Foto, type: image, options: { media: imagens } }
      - { name: email, label: E-mail público, type: string }
      - { name: lattes, label: Link do Lattes, type: string }
      - name: links
        label: Outros links
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: nome_en, label: Nome (inglês), type: string }
          - { name: nome_es, label: Nome (espanhol), type: string }
          - { name: url, label: Endereço, type: string }
      - name: formacao
        label: Formação
        type: object
        list: true
        fields:
          - { name: curso, label: Curso, type: string }
          - { name: instituicao, label: Instituição, type: string }
          - { name: inicio, label: Início, type: string }
          - { name: fim, label: Fim (ex. em andamento), type: string }
          - { name: descricao, label: Descrição, type: text }
          - { name: curso_en, label: Curso (inglês), type: string }
          - { name: instituicao_en, label: Instituição (inglês), type: string }
          - { name: fim_en, label: Fim (inglês), type: string }
          - { name: descricao_en, label: Descrição (inglês), type: text }
          - { name: curso_es, label: Curso (espanhol), type: string }
          - { name: instituicao_es, label: Instituição (espanhol), type: string }
          - { name: fim_es, label: Fim (espanhol), type: string }
          - { name: descricao_es, label: Descrição (espanhol), type: text }
      - name: experiencias
        label: Pesquisa e atuação
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: local, label: Local, type: string }
          - { name: periodo, label: Período, type: string }
          - { name: descricao, label: Descrição, type: text }
          - { name: titulo_en, label: Título (inglês), type: string }
          - { name: local_en, label: Local (inglês), type: string }
          - { name: periodo_en, label: Período (inglês), type: string }
          - { name: descricao_en, label: Descrição (inglês), type: text }
          - { name: titulo_es, label: Título (espanhol), type: string }
          - { name: local_es, label: Local (espanhol), type: string }
          - { name: periodo_es, label: Período (espanhol), type: string }
          - { name: descricao_es, label: Descrição (espanhol), type: text }
      - name: publicacoes
        label: Publicações
        type: object
        list: true
        fields:
          - { name: referencia, label: Referência, type: text }
          - { name: referencia_en, label: Referência (inglês), type: text }
          - { name: referencia_es, label: Referência (espanhol), type: text }
          - { name: ano, label: Ano, type: string }
          - { name: link, label: Link, type: string }
      - name: premios
        label: Prêmios
        type: object
        list: true
        fields:
          - { name: titulo, label: Prêmio, type: string }
          - { name: titulo_en, label: Prêmio (inglês), type: string }
          - { name: titulo_es, label: Prêmio (espanhol), type: string }
          - { name: ano, label: Ano, type: string }

  # ---------------- BIBLIOTECA ----------------
  - name: livros
    label: Biblioteca
    type: collection
    path: src/content/livros
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titulo, autor, status]
      primary: titulo
      sort: titulo
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: titulo_en, label: Título (inglês), type: string }
      - { name: titulo_es, label: Título (espanhol), type: string }
      - { name: autor, label: Autor, type: string, required: true }
      - { name: ano, label: Ano, type: number }
      - { name: capa, label: Capa (opcional), type: image, options: { media: imagens } }
      - name: status
        label: Status
        type: select
        default: lido
        options:
          values:
            - { name: lido, label: Lido }
            - { name: lendo, label: Lendo agora }
            - { name: quero-ler, label: Quero ler }
            - { name: consulta, label: Para consulta }
      - { name: nota, label: Nota (0 a 5), type: number }
      - { name: area, label: Área, type: string }
      - { name: area_en, label: Área (inglês), type: string }
      - { name: area_es, label: Área (espanhol), type: string }
      - { name: usei_para, label: Para que usei, type: text }
      - { name: usei_para_en, label: Para que usei (inglês), type: text }
      - { name: usei_para_es, label: Para que usei (espanhol), type: text }
      - { name: body, label: Minha impressão, type: rich-text, options: { format: markdown } }
      - { name: impressao_en, label: Minha impressão (inglês), type: rich-text, options: { format: markdown } }
      - { name: impressao_es, label: Minha impressão (espanhol), type: rich-text, options: { format: markdown } }

  # ---------------- CAMINHO ----------------
  - name: disciplinas
    label: Caminho (disciplinas)
    type: collection
    path: src/content/disciplinas
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titulo, etapa, status]
      primary: titulo
      sort: etapa
    fields:
      - { name: titulo, label: Disciplina, type: string, required: true }
      - { name: etapa, label: Etapa no mapa (1, 2, 3...), type: number, required: true }
      - name: status
        label: Status
        type: select
        default: planejada
        options:
          values:
            - { name: concluida, label: Concluída }
            - { name: cursando, label: Cursando }
            - { name: planejada, label: Planejada }
            - { name: sonho, label: Objetivo final }
      - { name: periodo, label: Período (ex. 2024.1), type: string }
      - { name: comentario, label: Comentário curto, type: string }
      - { name: titulo_en, label: Nome em inglês, type: string }
      - { name: titulo_es, label: Nome em espanhol, type: string }
      - { name: comentario_en, label: Comentário em inglês, type: string }
      - { name: comentario_es, label: Comentário em espanhol, type: string }

  # ---------------- INTERESSES ----------------
  - name: interesses
    label: Interesses
    type: collection
    path: src/content/interesses
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titulo, ordem]
      primary: titulo
      sort: ordem
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: resumo, label: Resumo (uma frase), type: string, required: true }
      - { name: desde, label: Desde (ano), type: string }
      - { name: ordem, label: Ordem na lista, type: number, default: 10 }
      - { name: body, label: Texto, type: rich-text, options: { format: markdown } }
      - { name: titulo_en, label: Título em inglês, type: string }
      - { name: resumo_en, label: Resumo em inglês, type: string }
      - { name: texto_en, label: Texto em inglês, type: rich-text, options: { format: markdown } }
      - { name: titulo_es, label: Título em espanhol, type: string }
      - { name: resumo_es, label: Resumo em espanhol, type: string }
      - { name: texto_es, label: Texto em espanhol, type: rich-text, options: { format: markdown } }

  # ---------------- DOCUMENTOS ----------------
  - name: documentos
    label: Documentos (PDFs)
    type: collection
    path: src/content/documentos
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titulo, tipo, data]
      primary: titulo
      sort: data
      order: desc
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - name: tipo
        label: Tipo
        type: select
        default: notas
        options:
          values:
            - { name: notas, label: Notas de aula }
            - { name: relatorio, label: Relatório }
            - { name: artigo, label: Artigo }
            - { name: apresentacao, label: Apresentação }
            - { name: outro, label: Outro }
      - { name: data, label: Data, type: date, required: true }
      - { name: arquivo, label: Arquivo PDF, type: file, required: true, options: { media: documentos } }
      - { name: descricao, label: Descrição, type: text }
      - { name: titulo_en, label: Título em inglês, type: string }
      - { name: descricao_en, label: Descrição em inglês, type: text }
      - { name: titulo_es, label: Título em espanhol, type: string }
      - { name: descricao_es, label: Descrição em espanhol, type: text }

  # ---------------- COMO ESTE SITE FOI FEITO ----------------
  - name: sobre
    label: Como este site foi feito
    type: file
    path: src/content/sobre/site.md
    format: yaml-frontmatter
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: body, label: Texto, type: rich-text, options: { format: markdown } }
      - { name: titulo_en, label: Título (inglês), type: string }
      - { name: texto_en, label: Texto (inglês), type: rich-text, options: { format: markdown } }
      - { name: titulo_es, label: Título (espanhol), type: string }
      - { name: texto_es, label: Texto (espanhol), type: rich-text, options: { format: markdown } }

  # ---------------- HISTÓRIAS DA PÁGINA INICIAL ----------------
  - name: historias
    label: Histórias da página inicial
    type: collection
    path: src/content/historias
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titulo, ordem, rascunho]
      primary: titulo
      sort: ordem
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: resumo, label: Resumo (aparece no cartão), type: text }
      - { name: capa, label: Imagem de capa (opcional; sem ela o site desenha uma ilustração), type: image, options: { media: imagens } }
      - { name: ordem, label: Ordem na página inicial, type: number, default: 10 }
      - { name: rascunho, label: Rascunho (não aparece no site), type: boolean, default: false }
      - { name: body, label: Texto (aceita imagens no meio), type: rich-text, options: { format: markdown } }
      - { name: titulo_en, label: Título (inglês), type: string }
      - { name: resumo_en, label: Resumo (inglês), type: text }
      - { name: texto_en, label: Texto (inglês), type: rich-text, options: { format: markdown } }
      - { name: titulo_es, label: Título (espanhol), type: string }
      - { name: resumo_es, label: Resumo (espanhol), type: text }
      - { name: texto_es, label: Texto (espanhol), type: rich-text, options: { format: markdown } }

  # ---------------- TEXTOS DO SITE ----------------
  - name: textos
    label: Textos do site (menus, títulos e botões)
    type: file
    path: src/data/textos.yml
    format: yaml
    fields:
      - name: geral
        label: Geral (botões e avisos)
        type: object
        fields:
          - name: traducao
            label: "Este texto ainda não foi traduzido, então aparece em port..."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: contato
            label: "Contato"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: tema
            label: "Alternar tema claro e escuro"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: idioma
            label: "Idioma"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: pular
            label: "Pular para o conteúdo"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: menu
            label: "Menu"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: lattes
            label: "Lattes"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
      - name: nav
        label: Menu do topo
        type: object
        fields:
          - name: inicio
            label: "Início"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: biblioteca
            label: "Biblioteca"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: caminho
            label: "Caminho"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: interesses
            label: "Interesses"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: documentos
            label: "Documentos"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: curriculo
            label: "Currículo"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
      - name: inicio
        label: Página inicial
        type: object
        fields:
          - name: explore
            label: "Explorar o site"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: biblioteca
            label: "Os livros da minha estante e o que cada um me deu."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: caminho
            label: "As disciplinas que já cursei e as que ainda quero cursar."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: interesses
            label: "O que me interessa, como começou e o que faço a respeito."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: documentos
            label: "Notas de aula, relatórios e outros textos meus."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: curriculo
            label: "Formação, pesquisa, publicações e prêmios."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: pesquisa
            label: "Pesquisa atual"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: cursando
            label: "Cursando agora"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: objetivo
            label: "Objetivo"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
      - name: bv
        label: Apresentação da primeira visita
        type: object
        fields:
          - name: rotulo
            label: "Boas-vindas"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: ola
            label: "Bem-vindo ao meu portfólio"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: idioma_titulo
            label: "Escolha o idioma"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: idioma_nota
            label: "Dá para mudar depois, no topo da página."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: tema_titulo
            label: "Claro ou escuro?"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: tema_nota
            label: "Também dá para trocar depois, no botão do topo."
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: claro
            label: "Claro"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: escuro
            label: "Escuro"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: pular
            label: "Pular"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
      - name: bib
        label: Biblioteca
        type: object
        fields:
          - name: titulo
            label: "Biblioteca"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: intro
            label: "Todos os livros da minha estante, com o que achei de cada..."
            type: object
            fields:
              - { name: pt, label: Português, type: text }
              - { name: en, label: Inglês, type: text }
              - { name: es, label: Espanhol, type: text }
          - name: todos
            label: "Todos"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: lido
            label: "Lidos"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: lendo
            label: "Lendo"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: quero_ler
            label: "Quero ler"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: consulta
            label: "Consulta"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: status_lido
            label: "Lido"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: status_lendo
            label: "Lendo agora"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: status_quero_ler
            label: "Na fila"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
          - name: status_consulta
            label: "Para consulta"
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: Inglês, type: string }
              - { name: es, label: Espanhol, type: string }
